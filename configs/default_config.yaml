# Default configuration for Speech Recognition Training

# Model architecture parameters
model:
  n_cnn_layers: 3
  n_rnn_layers: 5
  rnn_dim: 512
  n_class: 29
  n_feats: 128
  stride: 2
  dropout: 0.1
  use_attention: true
  n_attention_heads: 8
  use_transformer: false
  use_se: false

# Training parameters
training:
  batch_size: 10
  epochs: 1
  learning_rate: 0.0005
  weight_decay: 0.00001
  gradient_accumulation_steps: 1
  max_grad_norm: 1.0
  use_amp: true
  num_workers: 4
  pin_memory: true
  validate_every: 1
  save_every: 10
  early_stopping_patience: null
  scheduler_type: "onecycle"
  scheduler_params:
    anneal_strategy: "linear"

# Data parameters
data:
  train_root: "/kaggle/input/librispeech-clean"
  test_root: "/kaggle/input/librispeech-clean"
  train_url: "train-clean-100"
  test_url: "test-clean"
  sample_rate: 16000
  n_mels: 128
  freq_mask_param: 30
  time_mask_param: 100
  num_freq_masks: 2
  num_time_masks: 2

# General settings
checkpoint_dir: "checkpoints"
log_dir: "logs"
device: "cuda"
seed: 42

