# Default configuration for Speech Recognition Training

# Model architecture parameters (Optimized for 6GB GPU)
model:
  n_cnn_layers: 2           # Reduced for memory efficiency
  n_rnn_layers: 3           # Reduced from 6 for memory efficiency
  rnn_dim: 128              # Reduced from 448 for 6GB GPU memory constraints
  n_class: 29  # Will be updated dynamically based on TextTransform vocabulary size
  n_feats: 64
  stride: 2
  dropout: 0.1
  use_attention: true       # Re-enabled with chunked attention
  n_attention_heads: 2      # Keep at 4 (good balance)
  use_transformer: false
  use_se: true              # Enable squeeze-and-excitation
  use_chunked_attention: true  # Use memory-efficient chunked attention
  attention_chunk_size: 128     # Reduced chunk size for memory efficiency
  attention_overlap: 16         # Reduced overlap for memory efficiency

# Training parameters
training:
  batch_size: 1             # Reduced to 2 for 6GB GPU memory constraints
  epochs: 5                # Increased for better training (can stop early)
  learning_rate: 0.00005     # Base learning rate (also used as min_lr for schedulers)
  max_lr: 0.0005             # Maximum LR for OneCycleLR (5-10x learning_rate)
  weight_decay: 0.0001      # Increased to prevent overfitting
  gradient_accumulation_steps: 4  # Increased to maintain effective batch size of 16
  max_grad_norm: 1.0
  use_amp: true
  num_workers: 2
  pin_memory: true
  validate_every: 2
  save_every: 3             # Save more frequently
  early_stopping_patience: 10  # Stop if no improvement for 10 validations (more patient for CTC)
  warmup_steps: 500            # Linear LR warmup steps (stabilizes early CTC training)
  scheduler_type: "onecycle"
  scheduler_params:
    anneal_strategy: "linear"

# Data parameters
data:
  dataset_type: "custom"  # "librispeech" or "custom"
  # LibriSpeech paths (used when dataset_type is "librispeech")
  train_root: "/kaggle/input/librispeech-clean"
  test_root: "/kaggle/input/librispeech-clean"
  train_url: "train-clean-100"
  test_url: "test-clean"
  # Custom dataset paths (used when dataset_type is "custom")
  audio_files_dir: "dataset/audio_files"
  transcripts_dir: "dataset/info"
  test_audio_dir: "dataset/test_audio"  # Separate test set directory
  train_split: 0.7  # 80% train, 20% validation
  include_persian: true  # Enable Persian character support
  # Audio processing
  sample_rate: 16000
  n_mels: 64
  freq_mask_param: 15
  time_mask_param: 50
  num_freq_masks: 1
  num_time_masks: 1

# General settings
checkpoint_dir: "checkpoints"
log_dir: "logs"
device: "cuda"
seed: 42

